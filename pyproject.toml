[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protinteract"
version = "0.2.0"
description = "UniProt to AlphaFold Server JSON preparation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["protinteract*"]

[tool.setuptools.package-data]
protinteract = ["web/*", "web/fonts/*", "manual/*.md", "manual/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
